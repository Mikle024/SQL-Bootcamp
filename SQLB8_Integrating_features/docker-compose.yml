version: '3.8'

services:
  db:
    container_name: sql_day8
    build:
      context: .  # Указываем корневую директорию проекта
      dockerfile: src/Dockerfile  # Путь к Dockerfile
    volumes:
      - ./materials/model.sql:/docker-entrypoint-initdb.d/00_model.sql
      - ./src:/home/src
      - ../SQLB4_DML/src/ex07/day03_ex07.sql:/docker-entrypoint-initdb.d/08_day03_ex07.sql
      - ../SQLB4_DML/src/ex08/day03_ex08.sql:/docker-entrypoint-initdb.d/09_day03_ex08.sql
      - ../SQLB4_DML/src/ex09/day03_ex09.sql:/docker-entrypoint-initdb.d/10_day03_ex09.sql
      - ../SQLB4_DML/src/ex10/day03_ex10.sql:/docker-entrypoint-initdb.d/11_day03_ex10.sql
      - ../SQLB4_DML/src/ex11/day03_ex11.sql:/docker-entrypoint-initdb.d/12_day03_ex11.sql
      - ../SQLB4_DML/src/ex12/day03_ex12.sql:/docker-entrypoint-initdb.d/13_day03_ex12.sql
      - ../SQLB5_Snapshots/src/ex07/day04_ex07.sql:/docker-entrypoint-initdb.d/22_day04_ex07.sql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: base
    ports:
      - "5432:5432"
