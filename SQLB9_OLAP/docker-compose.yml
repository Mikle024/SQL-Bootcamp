version: '3.8'

services:
  db:
    container_name: sql_day9
    build:
      context: .
      dockerfile: src/Dockerfile
    volumes:
      - ./materials/model.sql:/docker-entrypoint-initdb.d/00_model.sql
      - ../SQLB4_DML/src/ex07/day03_ex07.sql:/docker-entrypoint-initdb.d/01_day03_ex07.sql
      - ../SQLB4_DML/src/ex08/day03_ex08.sql:/docker-entrypoint-initdb.d/02_day03_ex08.sql
      - ../SQLB4_DML/src/ex09/day03_ex09.sql:/docker-entrypoint-initdb.d/03_day03_ex09.sql
      - ../SQLB4_DML/src/ex10/day03_ex10.sql:/docker-entrypoint-initdb.d/04_day03_ex10.sql
      - ../SQLB4_DML/src/ex11/day03_ex11.sql:/docker-entrypoint-initdb.d/05_day03_ex11.sql
      - ../SQLB4_DML/src/ex12/day03_ex12.sql:/docker-entrypoint-initdb.d/06_day03_ex12.sql
      - ../SQLB4_DML/src/ex13/day03_ex13.sql:/docker-entrypoint-initdb.d/07_day03_ex13.sql
      - ../SQLB5_Snapshots/src/ex07/day04_ex07.sql:/docker-entrypoint-initdb.d/08_day04_ex07.sql
      - ./src:/home/src
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: base
    ports:
      - "5432:5432"
