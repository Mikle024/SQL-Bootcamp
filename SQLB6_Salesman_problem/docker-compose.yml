version: '3.8'

services:
  db:
    container_name: sql_day6
    build:
      context: .
      dockerfile: src/Dockerfile
    volumes:
      - ./src/ex00/0.sql:/docker-entrypoint-initdb.d/model.sql
      - ./src:/home/src
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: base
    ports:
      - "5432:5432"
